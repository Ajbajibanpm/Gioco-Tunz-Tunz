<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>MANDRIA IGNORANTE 🍻</title>
    <link rel="stylesheet" href="style.css">
    <style>
        #settings-btn { position: fixed; top: 10px; right: 10px; z-index: 1000; cursor: pointer; font-size: 1.5rem; }
        #settings-panel { position: fixed; top: 50px; right: 10px; background: rgba(0,0,0,0.8); padding: 10px; display: none; }
        .screen { display: none; text-align: center; }
        .active-screen { display: block; }
        #skip-btn { display: none; margin-top: 20px; padding: 10px 20px; font-size: 1.2rem; }
        #vote-counter { font-size: 1.2rem; margin: 10px 0; color: #fff; }
        #slot-container { height: 100px; display: flex; align-items: center; justify-content: center; overflow: hidden; border: 2px solid var(--cyan); margin: 20px; display: none; font-size: 1.5rem; color: var(--pink); }
    </style>
</head>
<body>

    <div id="settings-btn" onclick="toggleSettings()">⚙️</div>
    <div id="settings-panel">
        <button onclick="toggleMusic()">Musica ON/OFF</button>
    </div>

    <div id="screen-1" class="screen active-screen" onclick="showConfig()">
        <h1 style="font-size: 3rem; color: var(--pink); margin: 0;">MANDRIA</h1>
        <h1 style="font-size: 3rem; color: var(--cyan); margin: 0;">IGNORANTE</h1>
        <p>[ CLICCA PER ENTRARE ]</p>
    </div>

    <div id="screen-2" class="screen">
        <h2>ISTRUZIONI</h2>
        <p>Votate la vostra risposta. Quando tutti hanno scelto, premete avanti!</p>
        <input type="number" id="num-q" min="1" max="10" value="5">
        <br><br>
        <button onclick="startGame()">INIZIA PARTITA</button>
    </div>
    
    <div id="game-container" class="screen">
        <div id="timer-container"><div id="timer">60</div></div>
        <div id="vote-counter">Voti ricevuti: 0</div>
        
        <div id="slot-container"></div>
        
        <div class="question" id="q-text">CARICAMENTO...</div>
        <ul class="options" id="opt-list">
            <li onclick="selectOption(this, 0)"></li>
            <li onclick="selectOption(this, 1)"></li>
            <li onclick="selectOption(this, 2)"></li>
            <li onclick="selectOption(this, 3)"></li>
        </ul>
        <button id="skip-btn" onclick="showResult()">AVANTI ➡️</button>
    </div>

    <audio id="bg-music" loop preload="auto">
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
    </audio>

    <script>
        let domande = [], currentQ = 0, maxQ = 0, timeLeft = 60, timerId;
        let votes = [0, 0, 0, 0], isResultView = false;
        const music = document.getElementById('bg-music');

        fetch('domande.json').then(res => res.json()).then(data => domande = data);

        function toggleSettings() { document.getElementById('settings-panel').style.display = document.getElementById('settings-panel').style.display === 'block' ? 'none' : 'block'; }
        function toggleMusic() { music.paused ? music.play() : music.pause(); }
        function showConfig() { document.getElementById('screen-1').classList.remove('active-screen'); document.getElementById('screen-2').classList.add('active-screen'); }

        function startGame() {
            maxQ = Math.min(document.getElementById('num-q').value, 10);
            document.getElementById('screen-2').classList.remove('active-screen');
            document.getElementById('game-container').classList.add('active-screen');
            music.play().catch(e => console.log("Audio attende interazione"));
            loadQuestion();
        }

        function loadQuestion() {
            if(currentQ >= maxQ) {
                document.getElementById('q-text').innerText = "FINE.";
                return;
            }
            isResultView = false; votes = [0, 0, 0, 0];
            document.getElementById('vote-counter').innerText = "Voti ricevuti: 0";
            document.getElementById('skip-btn').style.display = 'none';
            document.getElementById('slot-container').style.display = 'none';
            document.getElementById('q-text').style.display = 'block';
            document.getElementById('opt-list').style.pointerEvents = 'auto';
            
            document.getElementById('q-text').innerText = domande[currentQ].q;
            const items = document.getElementById('opt-list').getElementsByTagName('li');
            for(let i=0; i<4; i++) { items[i].innerText = domande[currentQ].a[i]; items[i].style.background = ''; }
            
            clearInterval(timerId);
            timeLeft = 60; document.getElementById('timer').innerText = timeLeft;
            timerId = setInterval(() => { timeLeft--; document.getElementById('timer').innerText = timeLeft; if (timeLeft <= 0) unlock(); }, 1000);
        }

        function selectOption(el, index) {
            votes[index]++;
            document.getElementById('vote-counter').innerText = "Voti ricevuti: " + votes.reduce((a,b) => a+b, 0);
            document.getElementById('skip-btn').style.display = 'inline-block';
        }

        function showResult() {
            if (isResultView) { currentQ++; loadQuestion(); return; }
            clearInterval(timerId);
            const maxVotes = Math.max(...votes);
            const winners = votes.map((v, i) => v === maxVotes ? i : -1).filter(i => i !== -1);
            
            if (winners.length > 1) {
                runSlotMachine(winners);
            } else {
                finalizeResult(winners[0]);
            }
        }

        function runSlotMachine(winners) {
            const slot = document.getElementById('slot-container');
            slot.style.display = 'flex';
            document.getElementById('q-text').style.display = 'none';
            let i = 0;
            const spin = setInterval(() => {
                slot.innerText = domande[currentQ].a[winners[i % winners.length]];
                i++;
            }, 100);
            setTimeout(() => {
                clearInterval(spin);
                finalizeResult(winners[Math.floor(Math.random() * winners.length)]);
            }, 2000);
        }

        function finalizeResult(index) {
            document.getElementById('slot-container').style.display = 'none';
            document.getElementById('q-text').style.display = 'block';
            document.getElementById('q-text').innerText = "VINCITORE: " + domande[currentQ].a[index];
            // Colora solo il vincitore
            document.getElementById('opt-list').getElementsByTagName('li')[index].style.background = 'var(--pink)';
            document.getElementById('skip-btn').style.display = 'inline-block';
            document.getElementById('skip-btn').innerText = "PROSSIMA DOMANDA ➡️";
            isResultView = true;
        }

        function unlock() { clearInterval(timerId); document.getElementById('opt-list').style.pointerEvents = 'none'; }
    </script>
</body>
</html>
